name: Self-Healing — Rollout Restart

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Nome do Deployment a reiniciar (ex: auth-service)'
        required: true
        default: auth-service
      namespace:
        description: 'Namespace Kubernetes'
        required: true
        default: togglemaster

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::603727984890:role/CICD-self-healing
  EKS_CLUSTER: togglemaster

jobs:
  rollout-restart:
    name: Rollout Restart — ${{ inputs.service }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.EKS_CLUSTER }}

      - name: Rollout restart
        run: |
          kubectl rollout restart deployment/${{ inputs.service }} \
            -n ${{ inputs.namespace }}

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/${{ inputs.service }} \
            -n ${{ inputs.namespace }} \
            --timeout=120s
