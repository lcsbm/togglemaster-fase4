name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite DESTROY para confirmar a destruição de toda a infraestrutura'
        required: true

env:
  TF_VERSION: '1.12.0'
  TF_DIR: infra/terraform
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::603727984890:role/CICD-terraform-infra

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DESTROY'
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init

      - name: Configure kubectl
        run: aws eks update-kubeconfig --name togglemaster --region ${{ env.AWS_REGION }}
        continue-on-error: true

      - name: Pre-remove ArgoCD apps and stuck namespaces
        run: |
          # Remove finalizer da Application togglemaster para desbloquear o namespace
          kubectl patch application togglemaster -n argocd \
            -p '{"metadata":{"finalizers":null}}' --type=merge 2>/dev/null || true

          # Aguarda ArgoCD iniciar cascade delete (ou já está destruído)
          sleep 5

          # Force-remove finalizers do namespace togglemaster caso esteja em Terminating
          kubectl patch namespace togglemaster \
            -p '{"metadata":{"finalizers":null}}' --type=merge 2>/dev/null || true

          # Deleta namespaces de outros addons via API de finalizers
          for ns in keda external-secrets argocd ingress-nginx monitoring; do
            kubectl patch namespace "$ns" \
              -p '{"metadata":{"finalizers":null}}' --type=merge 2>/dev/null || true
          done
        continue-on-error: true

      - name: Pre-remove Helm releases
        run: |
          for release in keda external-secrets argocd ingress-nginx metrics-server; do
            ns=$release
            [ "$release" = "metrics-server" ] && ns=kube-system
            helm uninstall "$release" -n "$ns" --wait=false 2>/dev/null || true
          done
          kubectl delete namespace keda external-secrets argocd ingress-nginx \
            --ignore-not-found --wait=false 2>/dev/null || true
        continue-on-error: true

      - name: Terraform Destroy
        working-directory: ${{ env.TF_DIR }}
        timeout-minutes: 360
        # Primeira passada — pode falhar em SGs/rules já deletados pela AWS junto com o EKS
        run: terraform destroy -auto-approve || true
        env:
          TF_VAR_project: togglemaster
          TF_VAR_aws_region: ${{ env.AWS_REGION }}

      - name: Terraform Destroy (retry — limpa recursos órfãos do state)
        working-directory: ${{ env.TF_DIR }}
        timeout-minutes: 60
        run: terraform destroy -auto-approve
        env:
          TF_VAR_project: togglemaster
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
