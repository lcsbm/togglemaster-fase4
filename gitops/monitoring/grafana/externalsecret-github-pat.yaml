apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-github-pat
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-github-pat
    creationPolicy: Owner
  data:
    - secretKey: GITHUB_PAT
      remoteRef:
        key: togglemaster/github-pat
        property: token
