apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-togglemaster
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  togglemaster-overview.json: |
    {
      "title": "ToggleMaster — Visão Geral",
      "uid": "togglemaster-overview",
      "tags": ["togglemaster", "fase4"],
      "timezone": "browser",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-30m", "to": "now" },
      "templating": {
        "list": [
          {
            "hide": 2,
            "name": "prometheus",
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          },
          {
            "hide": 2,
            "name": "loki",
            "query": "loki",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "title": "Saúde do Cluster",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${prometheus}" },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "id": 2,
          "title": "Pods Running (togglemaster)",
          "type": "stat",
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "green", "value": 5 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{namespace=\"togglemaster\", phase=\"Running\"})",
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${prometheus}" },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "id": 3,
          "title": "Nós Ready",
          "type": "stat",
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "green", "value": 2 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "count(kube_node_status_condition{condition=\"Ready\", status=\"true\"})",
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${prometheus}" },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "id": 4,
          "title": "auth-service Réplicas Disponíveis",
          "type": "stat",
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "textMode": "auto",
            "orientation": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "green", "value": 2 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{deployment=\"auth-service\", namespace=\"togglemaster\"}",
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${prometheus}" },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "id": 5,
          "title": "Deployments Saudáveis",
          "type": "stat",
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 3 },
                  { "color": "green", "value": 5 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "count(kube_deployment_status_replicas_available{namespace=\"togglemaster\"} >= 1)",
              "instant": true,
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${prometheus}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 5 },
          "id": 6,
          "title": "CPU por Pod (togglemaster)",
          "type": "timeseries",
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"togglemaster\", container!=\"\", container!=\"POD\"}[5m])) by (pod)",
              "legendFormat": "{{ pod }}",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${prometheus}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 5 },
          "id": 7,
          "title": "Memória por Pod (togglemaster)",
          "type": "timeseries",
          "options": {
            "legend": { "calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"togglemaster\", container!=\"\", container!=\"POD\"}) by (pod)",
              "legendFormat": "{{ pod }}",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 13 },
          "id": 8,
          "title": "Requisições (Ingress)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${prometheus}" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "id": 9,
          "title": "Request Rate Total (req/s)",
          "type": "timeseries",
          "options": {
            "legend": { "displayMode": "list", "placement": "bottom" },
            "tooltip": { "mode": "single" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "lineWidth": 2, "fillOpacity": 15 },
              "color": { "mode": "palette-classic" }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(nginx_ingress_controller_nginx_process_requests_total[5m]))",
              "legendFormat": "total req/s",
              "refId": "A"
            }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "${prometheus}" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "id": 10,
          "title": "Request Rate por Ingress",
          "type": "timeseries",
          "options": {
            "legend": { "calcs": ["mean"], "displayMode": "table", "placement": "bottom" },
            "tooltip": { "mode": "multi" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "lineWidth": 2, "fillOpacity": 10 }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(nginx_ingress_controller_nginx_process_requests_total[5m])) by (ingress)",
              "legendFormat": "{{ ingress }}",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 22 },
          "id": 11,
          "title": "Self-Healing",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "${prometheus}" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 23 },
          "id": 12,
          "title": "Réplicas Disponíveis por Deployment (togglemaster)",
          "type": "timeseries",
          "options": {
            "legend": { "calcs": ["last"], "displayMode": "table", "placement": "right" },
            "tooltip": { "mode": "multi" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": { "lineWidth": 2, "fillOpacity": 20 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "color": { "mode": "thresholds" }
            }
          },
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"togglemaster\"}",
              "legendFormat": "{{ deployment }}",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 31 },
          "id": 13,
          "title": "Logs",
          "type": "row"
        },
        {
          "datasource": { "type": "loki", "uid": "${loki}" },
          "gridPos": { "h": 12, "w": 24, "x": 0, "y": 32 },
          "id": 14,
          "title": "Logs — namespace togglemaster",
          "type": "logs",
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": false
          },
          "targets": [
            {
              "expr": "{namespace=\"togglemaster\"} |= ``",
              "refId": "A"
            }
          ]
        }
      ]
    }
