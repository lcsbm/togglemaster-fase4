apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-contactpoints
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: grafana-contactpoints
    creationPolicy: Owner
    template:
      data:
        contactpoints.yaml: |
          apiVersion: 1
          contactPoints:
            - orgId: 1
              name: PagerDuty
              receivers:
                - uid: pagerduty-receiver
                  type: pagerduty
                  settings:
                    integrationKey: "{{ .pagerduty_key }}"
                    severity: critical
                    class: ToggleMaster
                    component: api
                    group: togglemaster
                  disableResolveMessage: false
            - orgId: 1
              name: Discord
              receivers:
                - uid: discord-receiver
                  type: discord
                  settings:
                    url: "{{ .discord_webhook }}"
                    message: |
                      **[{{ "{{" }} .Status | toUpper {{ "}}" }}]** {{ "{{" }} .CommonAnnotations.summary {{ "}}" }}
                      Severity: {{ "{{" }} .CommonLabels.severity {{ "}}" }}
                  disableResolveMessage: false
            - orgId: 1
              name: Self-Healing
              receivers:
                - uid: self-healing-receiver
                  type: webhook
                  settings:
                    url: http://self-healing-relay.monitoring.svc.cluster.local/
                    httpMethod: POST
                  disableResolveMessage: true
  data:
    - secretKey: pagerduty_key
      remoteRef:
        key: togglemaster/pagerduty
        property: integration_key
    - secretKey: discord_webhook
      remoteRef:
        key: togglemaster/discord
        property: webhook_url
