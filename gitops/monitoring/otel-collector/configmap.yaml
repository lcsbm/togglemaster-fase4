apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

    processors:
      batch:
        timeout: 5s
        send_batch_size: 1000
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64
      resource:
        attributes:
          - key: deployment.environment
            value: production
            action: upsert

    exporters:
      # Prometheus — métricas para o kube-prometheus-stack
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: togglemaster

      # Loki — logs estruturados
      loki:
        endpoint: http://loki-stack.monitoring.svc.cluster.local:3100/loki/api/v1/push
        default_labels_enabled:
          exporter: true
          job: true
          instance: true
          level: true

      # New Relic — APM traces + métricas
      otlp/newrelic:
        endpoint: otlp.nr-data.net:4317
        headers:
          api-key: "${NEW_RELIC_LICENSE_KEY}"

      # Debug (apenas em dev/staging)
      debug:
        verbosity: normal

    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"
      pprof:
        endpoint: "0.0.0.0:1888"
      zpages:
        endpoint: "0.0.0.0:55679"

    service:
      extensions: [health_check, pprof, zpages]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [otlp/newrelic]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [prometheus, otlp/newrelic]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch, resource]
          exporters: [loki, otlp/newrelic]
