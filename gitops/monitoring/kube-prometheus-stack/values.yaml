# kube-prometheus-stack — valores para o cluster ToggleMaster
# Inclui: Prometheus, Alertmanager, Grafana, kube-state-metrics, node-exporter

prometheus:
  prometheusSpec:
    retention: 15d
    # Scrape todos os ServiceMonitors do cluster, não só do namespace monitoring
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

grafana:
  enabled: true
  adminPassword: ""  # gerenciado via secret externo (grafana-admin-secret)
  existingSecret: grafana-admin-secret
  adminUser: admin
  # Injeta PAGERDUTY_KEY e DISCORD_WEBHOOK como env vars no container Grafana
  extraEnvFrom:
    - secretRef:
        name: grafana-alerting-secrets
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: monitoring
      label: grafana_dashboard
      labelValue: "1"
    datasources:
      enabled: true
      searchNamespace: monitoring
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # ── Alerting provisioning ──────────────────────────────────────────────────
  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: PagerDuty
          receivers:
            - uid: pagerduty-receiver
              type: pagerduty
              settings:
                integrationKey: ${PAGERDUTY_KEY}
                severity: critical
                class: ToggleMaster
                component: api
                group: togglemaster
              disableResolveMessage: false
        - orgId: 1
          name: Discord
          receivers:
            - uid: discord-receiver
              type: discord
              settings:
                url: ${DISCORD_WEBHOOK}
                message: |
                  **[{{ .Status | toUpper }}]** {{ .CommonAnnotations.summary }}
                  Severity: {{ .CommonLabels.severity }}
              disableResolveMessage: false

    policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: Discord
          groupBy: [alertname, severity]
          groupWait: 30s
          groupInterval: 5m
          repeatInterval: 4h
          routes:
            - receiver: PagerDuty
              matchers:
                - severity = critical
              continue: true
            - receiver: Discord
              matchers:
                - alertname =~ ".*"

    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: togglemaster-http
          folder: ToggleMaster
          interval: 1m
          rules:
            - uid: http-5xx-rate-high
              title: "Taxa de erros HTTP 5xx > 5%"
              condition: threshold
              data:
                - refId: rate
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: prometheus
                  model:
                    expr: |
                      sum(rate(nginx_ingress_controller_requests{namespace="togglemaster",status=~"5.."}[5m]))
                      /
                      sum(rate(nginx_ingress_controller_requests{namespace="togglemaster"}[5m]))
                    refId: rate
                - refId: threshold
                  datasourceUid: __expr__
                  model:
                    type: classic_conditions
                    refId: threshold
                    conditions:
                      - evaluator:
                          type: gt
                          params: [0.05]
                        operator:
                          type: and
                        query:
                          params: [rate]
                        reducer:
                          type: last
              noDataState: OK
              execErrState: Alerting
              for: 1m
              labels:
                severity: critical
                team: platform
              annotations:
                summary: "Taxa de erros 5xx acima de 5% em togglemaster"
                description: "A taxa de respostas HTTP 5xx ultrapassou 5% nos últimos 5 minutos."
                runbook: "https://github.com/lcsbm/togglemaster-fase4/blob/main/docs/runbooks/5xx-high.md"

# kube-state-metrics — expõe métricas dos objetos K8s
kube-state-metrics:
  enabled: true

# node-exporter — métricas dos nós
prometheus-node-exporter:
  enabled: true

# Desabilitar componentes que já gerenciamos
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
