# kube-prometheus-stack — valores para o cluster ToggleMaster
# Inclui: Prometheus, Alertmanager, Grafana, kube-state-metrics, node-exporter

prometheus:
  prometheusSpec:
    retention: 15d
    # Scrape todos os ServiceMonitors do cluster, não só do namespace monitoring
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: gp3
          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

grafana:
  enabled: true
  adminUser: admin
  existingSecret: grafana-admin-secret
  adminPassword: ""
  # Injeta credenciais de alerting e self-healing como env vars no container Grafana
  extraEnvFrom:
    - secretRef:
        name: grafana-alerting-secrets
    - secretRef:
        name: grafana-github-pat
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: monitoring
      label: grafana_dashboard
      labelValue: "1"
    datasources:
      enabled: true
      searchNamespace: monitoring
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-stack.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # ── Alerting provisioning ──────────────────────────────────────────────────
  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: PagerDuty
          receivers:
            - uid: pagerduty-receiver
              type: pagerduty
              settings:
                integrationKey: ${PAGERDUTY_KEY}
                severity: critical
                class: ToggleMaster
                component: api
                group: togglemaster
              disableResolveMessage: false
        - orgId: 1
          name: Discord
          receivers:
            - uid: discord-receiver
              type: discord
              settings:
                url: ${DISCORD_WEBHOOK}
                message: |
                  **[{{ "{{" }} .Status | toUpper {{ "}}" }}]** {{ "{{" }} .CommonAnnotations.summary {{ "}}" }}
                  Severity: {{ "{{" }} .CommonLabels.severity {{ "}}" }}
              disableResolveMessage: false
        - orgId: 1
          name: Self-Healing
          receivers:
            - uid: self-healing-receiver
              type: webhook
              settings:
                url: http://self-healing-relay.monitoring.svc.cluster.local/
                httpMethod: POST
              disableResolveMessage: true

    policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: Discord
          groupBy: [alertname, severity]
          groupWait: 30s
          groupInterval: 5m
          repeatInterval: 4h
          routes:
            - receiver: PagerDuty
              matchers:
                - severity = critical
              continue: true
            - receiver: Self-Healing
              matchers:
                - severity = critical
              continue: true
            - receiver: Discord
              matchers:
                - alertname =~ ".*"

    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: togglemaster-availability
          folder: ToggleMaster
          interval: 1m
          rules:
            - uid: auth-service-down
              title: "auth-service sem réplicas disponíveis"
              condition: threshold
              data:
                - refId: replicas
                  relativeTimeRange:
                    from: 300
                    to: 0
                  datasourceUid: prometheus
                  model:
                    expr: kube_deployment_status_replicas_available{deployment="auth-service",namespace="togglemaster"}
                    refId: replicas
                - refId: threshold
                  datasourceUid: __expr__
                  model:
                    type: classic_conditions
                    refId: threshold
                    conditions:
                      - evaluator:
                          type: lt
                          params: [1]
                        operator:
                          type: and
                        query:
                          params: [replicas]
                        reducer:
                          type: last
              noDataState: Alerting
              execErrState: Alerting
              for: 0m
              labels:
                severity: critical
                team: platform
              annotations:
                summary: "auth-service com 0 réplicas disponíveis em togglemaster"
                description: "O deployment auth-service não possui réplicas prontas. Self-healing iniciado."
                runbook: "https://github.com/lcsbm/togglemaster-fase4/blob/main/docs/runbooks/auth-service-down.md"

# kube-state-metrics — expõe métricas dos objetos K8s
kube-state-metrics:
  enabled: true

# node-exporter — métricas dos nós
prometheus-node-exporter:
  enabled: true

# Desabilitar componentes que já gerenciamos
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
