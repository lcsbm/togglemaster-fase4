# loki-stack — Loki + Promtail
# Grafana desabilitado (gerenciado pelo kube-prometheus-stack)

loki:
  enabled: true
  persistence:
    enabled: true
    size: 10Gi
    storageClassName: gp3
  config:
    limits_config:
      retention_period: 168h  # 7 dias
    chunk_store_config:
      max_look_back_period: 168h
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi

promtail:
  enabled: true
  config:
    logLevel: info
    serverPort: 3101
    clients:
      - url: http://loki-stack.monitoring.svc.cluster.local:3100/loki/api/v1/push
    snippets:
      pipelineStages:
        - cri: {}
        - labeldrop:
            - filename
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

grafana:
  enabled: false
  sidecar:
    datasources:
      enabled: false
