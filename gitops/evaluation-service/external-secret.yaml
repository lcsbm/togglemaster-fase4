apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: evaluation-service-secret
  namespace: togglemaster
spec:
  refreshInterval: "0"
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: evaluation-service-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: togglemaster/evaluation-service
