apiVersion: batch/v1
kind: Job
metadata:
  name: bootstrap-eval-key
  namespace: togglemaster
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: postgres:15-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              # ── auth_db: schema + chave do evaluation-service ──────────────
              psql "$AUTH_DATABASE_URL" -c "
                CREATE TABLE IF NOT EXISTS api_keys (
                  id         SERIAL PRIMARY KEY,
                  name       VARCHAR(100) NOT NULL,
                  key_hash   VARCHAR(64)  NOT NULL UNIQUE,
                  is_active  BOOLEAN DEFAULT true,
                  created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
                );"

              KEY_HASH=$(echo -n "$SERVICE_API_KEY" | sha256sum | awk '{print $1}')
              psql "$AUTH_DATABASE_URL" -c "
                INSERT INTO api_keys (name, key_hash)
                VALUES ('evaluation-service', '$KEY_HASH')
                ON CONFLICT (key_hash) DO NOTHING;"

              # ── flags_db: schema ───────────────────────────────────────────
              psql "$FLAGS_DATABASE_URL" -c "
                CREATE TABLE IF NOT EXISTS flags (
                  id          SERIAL PRIMARY KEY,
                  name        VARCHAR(100) UNIQUE NOT NULL,
                  description TEXT,
                  is_enabled  BOOLEAN NOT NULL DEFAULT false,
                  created_at  TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
                  updated_at  TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
                );
                CREATE OR REPLACE FUNCTION trigger_set_timestamp()
                RETURNS TRIGGER AS \$\$
                BEGIN NEW.updated_at = NOW(); RETURN NEW; END;
                \$\$ LANGUAGE plpgsql;
                DROP TRIGGER IF EXISTS set_timestamp ON flags;
                CREATE TRIGGER set_timestamp
                  BEFORE UPDATE ON flags
                  FOR EACH ROW EXECUTE PROCEDURE trigger_set_timestamp();"

              # ── targeting_db: schema ───────────────────────────────────────
              psql "$TARGETING_DATABASE_URL" -c "
                CREATE TABLE IF NOT EXISTS targeting_rules (
                  id          SERIAL PRIMARY KEY,
                  flag_name   VARCHAR(100) UNIQUE NOT NULL,
                  is_enabled  BOOLEAN NOT NULL DEFAULT true,
                  rules       JSONB NOT NULL,
                  created_at  TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
                  updated_at  TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
                );
                CREATE OR REPLACE FUNCTION trigger_set_timestamp()
                RETURNS TRIGGER AS \$\$
                BEGIN NEW.updated_at = NOW(); RETURN NEW; END;
                \$\$ LANGUAGE plpgsql;
                DROP TRIGGER IF EXISTS set_timestamp ON targeting_rules;
                CREATE TRIGGER set_timestamp
                  BEFORE UPDATE ON targeting_rules
                  FOR EACH ROW EXECUTE PROCEDURE trigger_set_timestamp();"

              echo "Bootstrap OK: schemas criados e chave do evaluation-service registrada."
          env:
            - name: AUTH_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: auth-service-secret
                  key: DATABASE_URL
            - name: FLAGS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: flag-service-secret
                  key: DATABASE_URL
            - name: TARGETING_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: targeting-service-secret
                  key: DATABASE_URL
            - name: SERVICE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: evaluation-service-secret
                  key: SERVICE_API_KEY
